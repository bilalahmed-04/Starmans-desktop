name: Release Windows build

# The entire release procedure is: bump Desktop_app/package.json's version,
# commit, tag `vX.Y.Z`, push the tag. This workflow does everything after
# that. See release_pipeline.md §5 for the full cutting-a-release procedure
# and §4 for the one rule that breaks this silently if skipped (version in
# package.json must match the tag — the tag only decides *when* to build,
# not what version ships).
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # required — publishing to GitHub Releases 403s without this

jobs:
  nsis-lint:
    uses: ./.github/workflows/nsis-lint.yml

  release:
    needs: nsis-lint
    runs-on: windows-latest
    # Without this, a hang anywhere in the job runs to GitHub Actions' default
    # 6-hour ceiling before failing - exactly what happened on the v1.0.11 run,
    # where the bundled SQL Server installer itself hung (see setup-sqlserver.ps1's
    # own timeout on that same call for the specific fix). 60 minutes is well
    # above every step's real observed duration (full build + real SQL install
    # + verify has taken well under 15 minutes end to end) and turns any future
    # hang into a fast, loud failure instead of a silent multi-hour one.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The shipped version comes from package.json, NOT the git tag — that's
      # what names the .exe and what latest.yml records. If they disagree, the
      # release is attached to the tag but its assets claim a different
      # version, and every client's update check compares wrongly and never
      # sees the update. So: read package.json for filenames, and fail the
      # build outright if it doesn't match the tag, rather than shipping a
      # mismatch that only surfaces months later as "updates don't work".
      - name: Resolve and check version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          V=$(node -p "require('./Desktop_app/package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "package.json version: $V"
          echo "git tag:              ${GITHUB_REF_NAME}"
          if [ "v$V" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Version mismatch: package.json says $V (expected tag v$V) but tag is ${GITHUB_REF_NAME}. Bump Desktop_app/package.json and re-tag."
            exit 1
          fi

      - run: npm install
        working-directory: Desktop_app

      - run: npm install
        working-directory: Desktop_app/Backend

      - run: npm install
        working-directory: Desktop_app/frontend/app

      # Build only — electron-builder does NOT publish (`--publish never`).
      # Its own GitHub publisher raced with itself on the v1.0.0 run: two
      # publisher instances started, both saw "release doesn't exist", both
      # created one (hence two duplicate releases), and the job exited while
      # the 795MB upload was still in flight — with no error and a green
      # tick. Uploading explicitly below is deterministic and fails loudly.
      # latest.yml is still produced here; it's a build artifact, not
      # something the publisher generates.
      - run: npm run release:win
        working-directory: Desktop_app
        env:
          # electron-builder's standard Windows code-signing env vars — it
          # auto-detects and signs when both are set, no package.json config
          # needed. CSC_LINK accepts base64-encoded .pfx content directly.
          # Confirmed working on the v1.0.0 run (signtool.exe invoked against
          # the .exe). See DECISIONS.md's code-signing entry for rotation.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      # Fail early and clearly if the build didn't produce what we expect,
      # rather than publishing a release that's missing its installer.
      # latest.yml is the easiest to lose and the most damaging: without it
      # every installed client's update check breaks, while the release page
      # still looks fine.
      - name: Verify build artifacts exist
        shell: bash
        working-directory: Desktop_app/release
        run: |
          set -euo pipefail
          ls -la
          test -f "Starmans-Sole-House-Setup-${{ steps.ver.outputs.version }}.exe" || { echo "::error::installer .exe missing"; exit 1; }
          test -f latest.yml || { echo "::error::latest.yml missing — auto-update would silently break"; exit 1; }
          test -f "Starmans-Sole-House-Setup-${{ steps.ver.outputs.version }}.exe.blockmap" || { echo "::error::blockmap missing"; exit 1; }

      # Everything above proves the BUILD succeeded. Nothing above has ever
      # proven the app can actually reach a database — six releases in a row
      # (1.0.3 through 1.0.9) shipped with real, previously-undetected bugs
      # in this exact path (wrong installer parameter name, NTLM auth
      # failure, a T-SQL syntax error, a BOM that crashed the whole app on
      # startup), each found only after a human manually tested on their own
      # Windows machine and reported back. This step runs the real
      # setup-sqlserver.ps1 against the real bundled SQL Server Express
      # installer, on this same windows-latest runner, and gates publishing
      # on it actually working — installing, connecting, and surviving an
      # update pass without losing data. See verify-sqlserver-install.ps1's
      # own comments for what each check catches and why.
      - name: Verify SQL Server actually installs and survives an update (real install, not a parse-check)
        shell: pwsh
        run: |
          & "Desktop_app\build\verify-sqlserver-install.ps1" -ResourcesDir "Desktop_app\release\win-unpacked\resources"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # One release, created explicitly, before any upload — no race possible.
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists — reusing it."
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes "Starmans Sole House ${GITHUB_REF_NAME}. See deployable/README.md for install instructions."
          fi

      # --clobber so re-running a failed release overwrites partial uploads
      # instead of erroring on an asset that's already there.
      - name: Upload release assets
        shell: bash
        working-directory: Desktop_app/release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          gh release upload "${GITHUB_REF_NAME}" \
            "Starmans-Sole-House-Setup-${V}.exe" \
            "Starmans-Sole-House-Setup-${V}.exe.blockmap" \
            latest.yml \
            --clobber

      # Prove the assets are actually on the release — the v1.0.0 failure
      # looked successful right up until you opened the release page.
      - name: Verify uploaded assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "${GITHUB_REF_NAME}" --json assets \
            --jq '.assets[] | "\(.name)  \(.size) bytes  \(.state)"'
          COUNT=$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '[.assets[] | select(.state=="uploaded")] | length')
          echo "uploaded assets: $COUNT"
          test "$COUNT" -ge 3 || { echo "::error::expected 3 uploaded assets, got $COUNT"; exit 1; }

      # The check that actually matters, and the one whose absence let v1.0.1
      # ship broken: assets being *present* is not the same as auto-update
      # *working*. In v1.0.1 all three uploaded fine, but latest.yml named
      # `Starmans-Sole-House-Setup-1.0.1.exe` while the asset had been stored
      # as `Starmans.Sole.House.Setup.1.0.1.exe` — GitHub and electron-builder
      # normalise spaces differently — so every client's updater would have
      # requested a URL that 404s. Fixed at the root via `artifactName` (no
      # spaces), but verified here too: parse the filename electron-updater
      # will actually request out of latest.yml, and fetch it anonymously,
      # exactly as a client would.
      - name: Verify the update feed resolves to a real download
        shell: bash
        run: |
          set -euo pipefail
          FEED="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/latest.yml"
          echo "feed: $FEED"
          curl -fsSL "$FEED" -o /tmp/latest.yml
          cat /tmp/latest.yml
          NAME=$(grep -E '^path:' /tmp/latest.yml | sed 's/^path:[[:space:]]*//' | tr -d '\r')
          echo "latest.yml points at: $NAME"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${NAME}"
          CODE=$(curl -sIL -o /dev/null -w '%{http_code}' "$URL")
          echo "HTTP $CODE for $URL"
          test "$CODE" = "200" || { echo "::error::latest.yml points at $NAME which does not resolve (HTTP $CODE) — auto-update would fail for every client"; exit 1; }
