name: NSIS script lint

# Compile-checks Desktop_app/build/installer.nsh under both electron-builder
# compile passes (installer + uninstaller) before a Windows build ever runs.
# See release_pipeline.md §2 Stage 2 and §6 Step 6 for why this exists: a
# script can compile fine as an installer and fail as an uninstaller (custom
# Vars/Functions referenced by hooks that only exist in the installer pass),
# and discovering that partway through a ~3.5 minute Windows job wastes CI
# time on every attempt.
#
# workflow_call: lets release.yml reuse this as a gate rather than duplicating it.
on:
  push:
    branches: [main]
    paths: ['Desktop_app/build/**', '.github/workflows/nsis-lint.yml']
  pull_request:
    paths: ['Desktop_app/build/**']
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y nsis
      # pwsh on PATH upgrades lint-nsis.sh's PowerShell check from an
      # encoding/brace-counting approximation to the real parser - see
      # DECISIONS.md's 1.0.9 entry for why that distinction mattered before.
      # ubuntu-latest already ships pwsh preinstalled, so this is normally a
      # no-op; the explicit install is only a fallback if that image changes.
      - run: command -v pwsh || (curl -fsSL -o /tmp/pwsh.tar.gz "https://github.com/PowerShell/PowerShell/releases/download/v7.4.6/powershell-7.4.6-linux-x64.tar.gz" && sudo mkdir -p /opt/microsoft/powershell/7 && sudo tar xzf /tmp/pwsh.tar.gz -C /opt/microsoft/powershell/7 && sudo ln -sf /opt/microsoft/powershell/7/pwsh /usr/bin/pwsh)
      - run: bash Desktop_app/build/lint-nsis.sh
